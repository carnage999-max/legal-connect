services:
  legal-connect-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.legalconnectapp.com}
    container_name: legal-connect-frontend
    env_file:
      - .env
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped

networks:
  default:
    name: shared-net
    external: true
